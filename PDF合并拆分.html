<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF 合并 · 拆分 · 抽页（离线，不上传）</title>
<style>
  :root{--bg:#0b0d12;--card:#141821;--line:#242a36;--txt:#e6e8ee;--dim:#8b94a6;--hi:#4ea1ff;--ok:#3ddc84;--warn:#ffb020}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.7 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 18px 60px}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .drop{border:2px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--dim);cursor:pointer}
  .drop.on,.drop:hover{border-color:var(--hi);color:var(--txt)}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin:16px 0}
  label{font-size:13px;color:var(--dim);display:block;margin-bottom:6px}
  input[type=text],input[type=number],select{background:#0f1319;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px;width:170px}
  .btn{background:var(--hi);color:#04101f;border:0;border-radius:9px;padding:10px 18px;font-weight:700;cursor:pointer}
  .btn[disabled],.btn[disabled]:hover{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line);font-weight:600}
  .stat{color:var(--dim);font-size:13px;margin:10px 0}
  .stat b{color:var(--ok)}
  .warn{color:var(--warn)}
  .scroll{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{position:sticky;top:0;background:#10141b;color:var(--dim)}
  .foot{margin-top:26px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
  .tabs{display:flex;gap:8px;margin:10px 0 4px}
  .tab{padding:8px 14px;border:1px solid var(--line);border-radius:999px;cursor:pointer;color:var(--dim);font-size:14px}
  .tab.on{background:#12233a;border-color:var(--hi);color:var(--txt)}
</style>
</head>
<body>
<div class="wrap">
  <h1>PDF 合并 · 拆分 · 抽页</h1>
  <div class="sub">全部在浏览器里做，<b>PDF 不会离开这台电脑</b>。断网可用（脚本已内嵌在本地）。</div>

  <div class="drop" id="drop">拖入 PDF（可多选），或点这里选<input type="file" id="file" accept="application/pdf" multiple hidden></div>

  <div class="tabs">
    <div class="tab on" data-mode="merge">合并成一个</div>
    <div class="tab" data-mode="split">按页拆成多个</div>
    <div class="tab" data-mode="extract">只抽指定页</div>
  </div>

  <div class="row" id="rowMerge">
    <div><label>合并顺序</label>
      <select id="order"><option value="list">按下面列表顺序</option><option value="name">按文件名排序</option></select>
    </div>
    <div><label>输出文件名</label><input type="text" id="outName" value="合并结果.pdf"></div>
  </div>

  <div class="row" id="rowSplit" hidden>
    <div><label>每几页切一份</label><input type="number" id="per" value="1" min="1"></div>
    <div><label>输出名前缀</label><input type="text" id="splitPrefix" value="第"></div>
  </div>

  <div class="row" id="rowExtract" hidden>
    <div><label>要抽的页（如 1-3,7,9-10）</label><input type="text" id="pages" value="1-3" style="width:220px"></div>
    <div><label>输出文件名</label><input type="text" id="extractName" value="抽页结果.pdf"></div>
  </div>

  <div class="row">
    <button class="btn" id="run" disabled>开始</button>
    <button class="btn ghost" id="clear">清空</button>
  </div>

  <div class="stat" id="stat">还没选文件。</div>
  <div class="scroll" id="scroll" hidden><table id="tbl"><thead><tr><th>#</th><th>文件</th><th>大小</th><th>页数</th></tr></thead><tbody></tbody></table></div>

  <div class="foot">
    用的 pdf-lib（已内嵌，不联网）。合并后书签/表单字段会丢失（PDF 标准限制），文字和图片不受影响。<br>
    缺功能 / 想定制 → <a href="支持.html" style="color:#4ea1ff">反馈与支持</a>
  </div>
</div>

<script src="pdf-lib.min.js"></script>
<script>
(function(){
  const $=(s)=>document.querySelector(s);
  const {PDFDocument}=PDFLib;
  const drop=$('#drop'), fileInput=$('#file'), stat=$('#stat');
  const tbl=$('#tbl'), tbody=tbl.querySelector('tbody'), scroll=$('#scroll');
  let files=[], mode='merge';
  const human=(b)=> b<1024? b+' B' : b<1048576? (b/1024).toFixed(1)+' KB' : (b/1048576).toFixed(2)+' MB';

  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on'); mode=t.dataset.mode;
    $('#rowMerge').hidden = mode!=='merge';
    $('#rowSplit').hidden = mode!=='split';
    $('#rowExtract').hidden = mode!=='extract';
  }));

  async function info(file){
    try{
      const buf=await file.arrayBuffer();
      const doc=await PDFDocument.load(buf,{ignoreEncryption:true});
      return {pages:doc.getPageCount(), buf};
    }catch(e){ return {pages:-1, err:e.message}; }
  }

  async function pick(list){
    files=[...list].filter(f=>/\.pdf$/i.test(f.name)||f.type==='application/pdf');
    if(!files.length){ stat.textContent='没选到 PDF。'; return }
    stat.textContent='读取页数…';
    tbody.innerHTML=''; let total=0;
    for(const f of files){
      const r=await info(f); f.__pages=r.pages; f.__buf=r.buf;
      total += Math.max(0,r.pages);
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${tbody.children.length+1}</td><td>${f.name}</td><td>${human(f.size)}</td><td>${r.pages>=0?r.pages:'<span class="warn">读不了（加密？）</span>'}</td>`;
      tbody.appendChild(tr);
    }
    scroll.hidden=false;
    stat.innerHTML=`已选 <b>${files.length}</b> 个 PDF，合计 ${total} 页`;
    $('#run').disabled=false;
  }

  drop.addEventListener('click',()=>fileInput.click());
  fileInput.addEventListener('change',e=>pick(e.target.files));
  ['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('on')}));
  ['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('on')}));
  drop.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) pick(e.dataTransfer.files) });
  $('#clear').addEventListener('click',()=>{ files=[]; tbody.innerHTML=''; scroll.hidden=true; $('#run').disabled=true; stat.textContent='还没选文件。'; fileInput.value=''; });

  function save(bytes,name){
    const blob=new Blob([bytes],{type:'application/pdf'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  }
  function parseRange(txt){
    const out=[];
    for(const part of String(txt).split(/[,，\s]+/).filter(Boolean)){
      const m=part.match(/^(\d+)(?:-(\d+))?$/);
      if(!m) continue;
      const a=+m[1], b=m[2]?+m[2]:a;
      for(let i=a;i<=b;i++) out.push(i);
    }
    return out;
  }

  $('#run').addEventListener('click',async()=>{
    if(!files.length) return;
    $('#run').disabled=true; stat.textContent='处理中…';
    try{
      if(mode==='merge'){
        const list = $('#order').value==='name' ? [...files].sort((a,b)=>a.name.localeCompare(b.name,'zh')) : [...files];
        const out=await PDFDocument.create();
        let n=0;
        for(const f of list){
          if(f.__pages<0) continue;
          const src=await PDFDocument.load(f.__buf,{ignoreEncryption:true});
          const pages=await out.copyPages(src, src.getPageIndices());
          pages.forEach(p=>out.addPage(p)); n+=pages.length;
        }
        if(!n) throw new Error('没有可合并的页');
        save(await out.save(), $('#outName').value.trim()||'合并结果.pdf');
        stat.innerHTML=`合并完成：<b>${n}</b> 页 → ${$('#outName').value||'合并结果.pdf'}（在浏览器下载文件夹）`;
      }
      else if(mode==='split'){
        const per=Math.max(1,Number($('#per').value)||1);
        const prefix=$('#splitPrefix').value.trim()||'第';
        let made=0;
        for(const f of files){
          if(f.__pages<0) continue;
          const src=await PDFDocument.load(f.__buf,{ignoreEncryption:true});
          const total=src.getPageCount();
          for(let start=0; start<total; start+=per){
            const idx=[]; for(let i=start;i<Math.min(start+per,total);i++) idx.push(i);
            const out=await PDFDocument.create();
            const pages=await out.copyPages(src, idx);
            pages.forEach(p=>out.addPage(p));
            const base=f.name.replace(/\.pdf$/i,'');
            save(await out.save(), `${base}_${prefix}${Math.floor(start/per)+1}份.pdf`);
            made++;
            await new Promise(r=>setTimeout(r,120)); // 浏览器连续下载要喘口气
          }
        }
        stat.innerHTML=`拆分完成：<b>${made}</b> 个文件已开始下载（浏览器若提示"允许下载多个文件"，点允许）`;
      }
      else{
        const want=parseRange($('#pages').value);
        if(!want.length) throw new Error('页号看不懂，示例：1-3,7,9-10');
        const out=await PDFDocument.create();
        let n=0;
        for(const f of files){
          if(f.__pages<0) continue;
          const src=await PDFDocument.load(f.__buf,{ignoreEncryption:true});
          const total=src.getPageCount();
          const idx=want.filter(p=>p>=1&&p<=total).map(p=>p-1);
          if(!idx.length) continue;
          const pages=await out.copyPages(src, idx);
          pages.forEach(p=>out.addPage(p)); n+=pages.length;
        }
        if(!n) throw new Error('这些页号在文件里不存在');
        save(await out.save(), $('#extractName').value.trim()||'抽页结果.pdf');
        stat.innerHTML=`抽页完成：<b>${n}</b> 页 → ${$('#extractName').value||'抽页结果.pdf'}`;
      }
    }catch(e){
      stat.innerHTML='<span class="warn">出错了：'+e.message+'</span>';
    }
    $('#run').disabled=false;
  });
})();
</script>
</body>
</html>
