<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片批量压缩 · 改尺寸 · 打包下载（离线，不上传）</title>
<style>
  :root{--bg:#0b0d12;--card:#141821;--line:#242a36;--txt:#e6e8ee;--dim:#8b94a6;--hi:#4ea1ff;--ok:#3ddc84;--warn:#ffb020}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.7 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:28px 18px 60px}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:22px}
  .drop{border:2px dashed var(--line);border-radius:14px;padding:34px;text-align:center;color:var(--dim);cursor:pointer;transition:.15s}
  .drop.on,.drop:hover{border-color:var(--hi);color:var(--txt)}
  .row{display:flex;flex-wrap:wrap;gap:14px;margin:18px 0}
  label{font-size:13px;color:var(--dim);display:block;margin-bottom:6px}
  input[type=number],input[type=text],select{background:#0f1319;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px;width:130px}
  .btn{background:var(--hi);color:#04101f;border:0;border-radius:9px;padding:10px 18px;font-weight:700;cursor:pointer}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line);font-weight:600}
  .stat{color:var(--dim);font-size:13px;margin:10px 0}
  .stat b{color:var(--ok)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600}
  .thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;background:#000}
  .foot{margin-top:34px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>图片批量压缩 · 改尺寸 · 打包下载</h1>
  <div class="sub">全部在浏览器里算完，<b>文件不会离开这台电脑</b>。断网也能用。</div>

  <div class="drop" id="drop">把图片拖进来，或点这里选（jpg / png / webp，可多选）<input type="file" id="file" accept="image/*" multiple hidden></div>

  <div class="row">
    <div><label>最长边像素（0=不改）</label><input type="number" id="maxSide" value="1600" min="0" step="100"></div>
    <div><label>质量（jpeg/webp）</label><input type="number" id="quality" value="82" min="30" max="100" step="1"></div>
    <div><label>输出格式</label>
      <select id="format"><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option><option value="image/png">PNG</option></select>
    </div>
    <div><label>文件名后缀</label><input type="text" id="suffix" value="_s"></div>
    <div><label><input type="checkbox" id="keepSmall" checked> 压完更大就保留原图</label></div>
  </div>

  <div class="row">
    <button class="btn" id="run" disabled>开始处理</button>
    <button class="btn ghost" id="zip" disabled>打包下载 zip</button>
    <button class="btn ghost" id="clear">清空</button>
  </div>

  <div class="stat" id="stat">还没选文件。</div>
  <table id="tbl" hidden>
    <thead><tr><th></th><th>文件</th><th>原尺寸</th><th>新尺寸</th><th>原大小</th><th>新大小</th></tr></thead>
    <tbody></tbody>
  </table>

  <div class="foot">做法：canvas 重采样 → 编码成目标格式。批量下载用的是"仅存储"的 zip（不压缩，所以快）。<br>批量改名的需求（比如「发票_2026-11_序号」）跟我说一声，可以加成规则。</div>
</div>

<script>
(function(){
  const $ = (s)=>document.querySelector(s);
  const drop=$('#drop'), fileInput=$('#file'), runBtn=$('#run'), zipBtn=$('#zip'), clearBtn=$('#clear');
  const tbl=$('#tbl'), tbody=tbl.querySelector('tbody'), stat=$('#stat');
  let items=[]; // {file, url, blob, outName, w0,h0,w1,h1}

  function human(b){ if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(1)+' KB'; return (b/1048576).toFixed(2)+' MB' }

  function addFiles(list){
    const arr=[...list].filter(f=>f.type.startsWith('image/'));
    if(!arr.length) return;
    for(const f of arr) items.push({file:f, url:URL.createObjectURL(f), blob:null});
    render();
  }

  drop.addEventListener('click',()=>fileInput.click());
  fileInput.addEventListener('change',e=>addFiles(e.target.files));
  ['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('on')}));
  ['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('on')}));
  drop.addEventListener('drop',e=>{ if(e.dataTransfer.files) addFiles(e.dataTransfer.files) });

  function render(){
    tbody.innerHTML='';
    tbl.hidden = items.length===0;
    runBtn.disabled = items.length===0;
    const total0 = items.reduce((s,i)=>s+i.file.size,0);
    stat.textContent = items.length ? `已选 ${items.length} 个文件，原始合计 ${human(total0)}` : '还没选文件。';
    for(const it of items){
      const tr=document.createElement('tr');
      tr.innerHTML = `<td><img class="thumb" src="${it.url}"></td>
        <td>${it.outName || it.file.name}</td>
        <td>${it.w0? it.w0+'×'+it.h0 : '-'}</td>
        <td>${it.w1? it.w1+'×'+it.h1 : '-'}</td>
        <td>${human(it.file.size)}</td>
        <td>${it.blob? human(it.blob.size)+(it.kept?' <span style="color:#8b94a6">原图</span>':'') : '-'}</td>`;
      tbody.appendChild(tr);
    }
    zipBtn.disabled = !items.some(i=>i.blob);
  }

  function loadImg(file){
    return new Promise((res,rej)=>{
      const img=new Image();
      img.onload=()=>res(img); img.onerror=rej;
      img.src=URL.createObjectURL(file);
    });
  }

  const EXT={'image/jpeg':'jpg','image/webp':'webp','image/png':'png'};

  runBtn.addEventListener('click', async ()=>{
    runBtn.disabled=true; stat.textContent='处理中…';
    const maxSide=Number($('#maxSide').value)||0, q=(Number($('#quality').value)||82)/100;
    const fmt=$('#format').value, suf=$('#suffix').value||'';
    let sum0=0,sum1=0;
    for(const it of items){
      try{
        const img=await loadImg(it.file);
        it.w0=img.naturalWidth; it.h0=img.naturalHeight;
        let w=it.w0,h=it.h0;
        if(maxSide>0 && Math.max(w,h)>maxSide){ const k=maxSide/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
        it.w1=w; it.h1=h;
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const ctx=cv.getContext('2d'); ctx.imageSmoothingQuality='high';
        if(fmt==='image/jpeg'){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); } // jpg 不透明底
        ctx.drawImage(img,0,0,w,h);
        const blob=await new Promise(r=>cv.toBlob(r,fmt,q));
        if(!blob) throw new Error('编码失败');
        const resized = (w!==it.w0 || h!==it.h0);
        const keepSmall = $('#keepSmall').checked;
        it.kept = false;
        if(keepSmall && !resized && blob.size >= it.file.size){
          // 没缩图、且重编码反而更大 → 保留原图（重编码不会让已经压过的图更好）
          it.blob = it.file; it.outName = it.file.name; it.kept = true;
        }else{
          it.blob = blob;
          const base=it.file.name.replace(/\.[^.]+$/,'');
          it.outName = base + suf + '.' + EXT[fmt];
        }
        sum0+=it.file.size; sum1+=it.blob.size;
      }catch(e){ it.err=e.message; }
    }
    render();
    const pct = sum0>0 ? 100*(1-sum1/sum0) : 0;
    const keptN = items.filter(i=>i.kept).length;
    const saveTxt = pct>=0 ? `<b>省了 ${pct.toFixed(1)}%</b>` : `<b style="color:#ffb020">变大了 ${Math.abs(pct).toFixed(1)}%</b>`;
    stat.innerHTML = `处理完：${items.filter(i=>i.blob).length} 个成功，原始 ${human(sum0)} → 现在 ${human(sum1)}，${saveTxt}`
      + (keptN? `　（其中 ${keptN} 张压完更大，已保留原图）`: '');
    runBtn.disabled=false;
  });

  // ---- 极简 zip（store，不压缩）：够用且零依赖 ----
  function crc32(u8){
    let c, crc=0xffffffff;
    for(let i=0;i<u8.length;i++){ c=(crc^u8[i])&0xff; for(let k=0;k<8;k++) c = c&1 ? (c>>>1)^0xEDB88320 : c>>>1; crc=(crc>>>8)^c; }
    return (crc^0xffffffff)>>>0;
  }
  function makeZip(files){ // [{name, u8}]
    const enc=new TextEncoder(); const parts=[]; const central=[]; let off=0;
    const dt=new Date(); const t=((dt.getHours()<<11)|(dt.getMinutes()<<5)|(dt.getSeconds()/2))&0xffff;
    const d=(((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate())&0xffff;
    for(const f of files){
      const name=enc.encode(f.name), crc=crc32(f.u8), sz=f.u8.length;
      const lh=new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
      lh.setUint16(8,0,true); lh.setUint16(10,t,true); lh.setUint16(12,d,true);
      lh.setUint32(14,crc,true); lh.setUint32(18,sz,true); lh.setUint32(22,sz,true);
      lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
      parts.push(new Uint8Array(lh.buffer), name, f.u8);
      const ch=new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
      ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true); ch.setUint16(12,t,true); ch.setUint16(14,d,true);
      ch.setUint32(16,crc,true); ch.setUint32(20,sz,true); ch.setUint32(24,sz,true);
      ch.setUint16(28,name.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true);
      ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,off,true);
      central.push(new Uint8Array(ch.buffer), name);
      off += 30+name.length+sz;
    }
    const cSize=central.reduce((s,a)=>s+a.length,0);
    const end=new DataView(new ArrayBuffer(22));
    end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
    end.setUint32(12,cSize,true); end.setUint32(16,off,true); end.setUint16(20,0,true);
    return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:'application/zip'});
  }

  zipBtn.addEventListener('click', async ()=>{
    const fs=[];
    for(const it of items){ if(!it.blob) continue; fs.push({name:it.outName, u8:new Uint8Array(await it.blob.arrayBuffer())}) }
    if(!fs.length) return;
    const blob=makeZip(fs);
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='图片处理结果.zip'; a.click();
    // 给个明确反馈：浏览器默认存到「下载」文件夹，没弹条就是被拦了
    const mb=(blob.size/1048576).toFixed(2);
    stat.innerHTML = `已打包 <b>${fs.length}</b> 张，<b>图片处理结果.zip（${mb} MB）</b><br>`
      + `<span style="color:#8b94a6">位置：浏览器默认下载文件夹（Windows 一般是 此电脑 → 下载，即 C:\\Users\\你的用户名\\Downloads）。`
      + `没看到？看浏览器右上角有没有下载条/被拦提示，或用「打包下载」旁的控制台无必要。</span>`;
  });

  clearBtn.addEventListener('click',()=>{ items.forEach(i=>URL.revokeObjectURL(i.url)); items=[]; render(); });
})();
</script>
<div style="max-width:960px;margin:0 auto;padding:0 18px 30px;color:#8b94a6;font-size:12px">缺功能 / 想定制 → <a href="支持.html" style="color:#4ea1ff">反馈与支持</a></div>
</body>
</html>
