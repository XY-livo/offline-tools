<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>批量重命名 · 发票/照片/合同（离线，不上传）</title>
<style>
  :root{--bg:#0b0d12;--card:#141821;--line:#242a36;--txt:#e6e8ee;--dim:#8b94a6;--hi:#4ea1ff;--ok:#3ddc84;--warn:#ffb020}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.7 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 18px 60px}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .drop{border:2px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--dim);cursor:pointer}
  .drop.on,.drop:hover{border-color:var(--hi);color:var(--txt)}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin:16px 0}
  label{font-size:13px;color:var(--dim);display:block;margin-bottom:6px}
  input[type=text],input[type=number],select{background:#0f1319;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px;width:150px}
  .btn{background:var(--hi);color:#04101f;border:0;border-radius:9px;padding:10px 18px;font-weight:700;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line);font-weight:600}
  .stat{color:var(--dim);font-size:13px;margin:10px 0}
  .stat b{color:var(--ok)}
  .warn{color:var(--warn)}
  .scroll{max-height:400px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:12px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{position:sticky;top:0;background:#10141b;color:var(--dim)}
  .mono{font-family:ui-monospace,Consolas,monospace}
  .foot{margin-top:26px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>批量重命名 · 发票 / 照片 / 合同</h1>
  <div class="sub">拖进一堆文件 → 按规则生成新名字 → 打包下载（文件名已改好）。<b>文件不上传，断网可用。</b></div>

  <div class="drop" id="drop">拖入文件（可多选，任意类型），或点这里选<input type="file" id="file" multiple hidden></div>

  <div class="row">
    <div><label>前缀</label><input type="text" id="prefix" value="发票"></div>
    <div><label>日期来源</label>
      <select id="dateSrc"><option value="mtime">文件修改时间</option><option value="none">不写日期</option><option value="fixed">固定日期（右填）</option></select>
    </div>
    <div><label>固定日期 YYYY-MM-DD</label><input type="text" id="fixedDate" placeholder="2026-11-06"></div>
    <div><label>分隔符</label><input type="text" id="sep" value="_"></div>
  </div>
  <div class="row">
    <div><label>序号位数</label><input type="number" id="pad" value="3" min="1" max="6"></div>
    <div><label>序号起始</label><input type="number" id="start" value="1" min="0"></div>
    <div><label>额外标记（可空）</label>
      <select id="extra"><option value="none">不加</option><option value="digits">文件名里的长数字（发票号）</option><option value="size">文件大小 KB</option></select>
    </div>
    <div><label><input type="checkbox" id="keepExt" checked> 保留原扩展名</label></div>
  </div>

  <div class="row">
    <button class="btn" id="preview" disabled>生成预览</button>
    <button class="btn" id="zip" disabled>打包下载（改名后）</button>
    <button class="btn ghost" id="clear">清空</button>
  </div>

  <div class="stat" id="stat">还没选文件。</div>
  <div class="scroll" id="scroll" hidden><table id="tbl"><thead><tr><th>原文件名</th><th>新文件名</th></tr></thead><tbody></tbody></table></div>

  <div class="foot">
    例：前缀「发票」+ 修改时间 + 序号 3 位 → <span class="mono">发票_2026-11-06_001.pdf</span><br>
    浏览器不许直接改你硬盘上的文件名（安全限制），所以这里给的是<b>打包好的 zip</b>：解压后就是新名字。
  </div>
</div>

<script>
(function(){
  const $=(s)=>document.querySelector(s);
  const drop=$('#drop'), fileInput=$('#file'), stat=$('#stat');
  const tbl=$('#tbl'), tbody=tbl.querySelector('tbody'), scroll=$('#scroll');
  let files=[], plan=[];

  const human=(b)=> b<1024? b+' B' : b<1048576? (b/1024).toFixed(1)+' KB' : (b/1048576).toFixed(2)+' MB';
  const pad=(n,l)=>String(n).padStart(l,'0');
  const ymd=(ms)=>{ const d=new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}` };

  function pick(list){
    files=[...list];
    stat.textContent = files.length? `已选 ${files.length} 个文件` : '还没选文件。';
    $('#preview').disabled = !files.length;
    $('#zip').disabled = true; plan=[]; tbody.innerHTML=''; scroll.hidden=true;
  }
  drop.addEventListener('click',()=>fileInput.click());
  fileInput.addEventListener('change',e=>pick(e.target.files));
  ['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('on')}));
  ['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('on')}));
  drop.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) pick(e.dataTransfer.files) });
  $('#clear').addEventListener('click',()=>{ files=[]; plan=[]; tbody.innerHTML=''; scroll.hidden=true; $('#preview').disabled=true; $('#zip').disabled=true; stat.textContent='还没选文件。' });

  $('#preview').addEventListener('click',()=>{
    const prefix=$('#prefix').value.trim();
    const src=$('#dateSrc').value, fixed=$('#fixedDate').value.trim();
    const sep=$('#sep').value, np=Math.max(1,Number($('#pad').value)||3), st=Number($('#start').value)||1;
    const extra=$('#extra').value, keepExt=$('#keepExt').checked;

    // 先按修改时间排序（发票/照片按时间排最自然），再编号
    const sorted=[...files].sort((a,b)=>a.lastModified-b.lastModified);
    plan=[]; tbody.innerHTML='';
    sorted.forEach((f,i)=>{
      const dot=f.name.lastIndexOf('.');
      const ext = keepExt && dot>0 ? f.name.slice(dot) : '';
      const parts=[];
      if(prefix) parts.push(prefix);
      if(src==='mtime') parts.push(ymd(f.lastModified));
      else if(src==='fixed' && fixed) parts.push(fixed);
      if(extra==='digits'){
        const m=f.name.match(/\d{6,}/);
        if(m) parts.push(m[0]);
      }else if(extra==='size'){
        parts.push(Math.round(f.size/1024)+'KB');
      }
      parts.push(pad(st+i,np));
      const name = parts.join(sep) + ext;
      plan.push({file:f, name});
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${f.name}</td><td class="mono">${name}</td>`;
      tbody.appendChild(tr);
      // 重名检查
      if(plan.filter(p=>p.name===name).length>1) tr.lastChild.style.color='#ffb020';
    });
    scroll.hidden=false;
    const dup=plan.length-new Set(plan.map(p=>p.name)).size;
    stat.innerHTML=`生成 ${plan.length} 个新名字`+(dup?`；<span class="warn">有 ${dup} 个重名（黄色标出），改一下前缀或序号位数</span>`:'');
    $('#zip').disabled = plan.length===0;
  });

  // ---- 极简 zip（store，不压缩）：零依赖 ----
  function crc32(u8){let c,crc=0xffffffff;for(let i=0;i<u8.length;i++){c=(crc^u8[i])&0xff;for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:c>>>1;crc=(crc>>>8)^c}return (crc^0xffffffff)>>>0}
  function makeZip(entries){
    const enc=new TextEncoder(), parts=[], central=[]; let off=0;
    const dt=new Date(), t=((dt.getHours()<<11)|(dt.getMinutes()<<5)|(dt.getSeconds()/2))&0xffff;
    const d=(((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate())&0xffff;
    for(const f of entries){
      const name=enc.encode(f.name), crc=crc32(f.u8), sz=f.u8.length;
      const lh=new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);
      lh.setUint16(8,0,true);lh.setUint16(10,t,true);lh.setUint16(12,d,true);
      lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);
      lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
      parts.push(new Uint8Array(lh.buffer),name,f.u8);
      const ch=new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);
      ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,t,true);ch.setUint16(14,d,true);
      ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);
      ch.setUint16(28,name.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);
      ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,off,true);
      central.push(new Uint8Array(ch.buffer),name);
      off+=30+name.length+sz;
    }
    const cSize=central.reduce((s,a)=>s+a.length,0);
    const end=new DataView(new ArrayBuffer(22));
    end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);
    end.setUint32(12,cSize,true);end.setUint32(16,off,true);end.setUint16(20,0,true);
    return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:'application/zip'});
  }

  $('#zip').addEventListener('click',async()=>{
    if(!plan.length) return;
    const entries=[];
    for(const p of plan){
      const u8=new Uint8Array(await p.file.arrayBuffer());
      entries.push({name:p.name, u8});
    }
    const blob=makeZip(entries);
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='改名结果.zip'; a.click();
    stat.innerHTML=`已打包 <b>${plan.length}</b> 个文件 → <b>改名结果.zip（${human(blob.size)}）</b>，在浏览器默认下载文件夹。`;
  });
})();
</script>
<div style="max-width:960px;margin:0 auto;padding:0 18px 30px;color:#8b94a6;font-size:12px">缺功能 / 想定制 → <a href="支持.html" style="color:#4ea1ff">反馈与支持</a></div>
</body>
</html>
