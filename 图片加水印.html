<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片批量加水印（离线，不上传）</title>
<style>
  :root{--bg:#0b0d12;--card:#141821;--line:#242a36;--txt:#e6e8ee;--dim:#8b94a6;--hi:#4ea1ff;--ok:#3ddc84;--warn:#ffb020}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.7 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 18px 60px}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  .drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--dim);cursor:pointer}
  .drop.on,.drop:hover{border-color:var(--hi);color:var(--txt)}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin:14px 0}
  label{font-size:13px;color:var(--dim);display:block;margin-bottom:6px}
  input[type=text],input[type=number],select{background:#0f1319;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px;width:150px}
  input[type=color]{width:44px;height:36px;background:#0f1319;border:1px solid var(--line);border-radius:8px}
  .btn{background:var(--hi);color:#04101f;border:0;border-radius:9px;padding:10px 18px;font-weight:700;cursor:pointer}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line);font-weight:600}
  .stat{color:var(--dim);font-size:13px;margin:10px 0}
  .stat b{color:var(--ok)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:14px}
  .cell{background:#0f1319;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .cell img{width:100%;display:block;height:130px;object-fit:cover}
  .cell div{font-size:11.5px;color:var(--dim);padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .foot{margin-top:26px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>图片批量加水印</h1>
  <div class="sub">文字水印，位置/透明度/大小/颜色可调；<b>不上传、断网可用</b>。</div>

  <div class="drop" id="drop">拖入图片（可多选），或点这里选<input type="file" id="file" accept="image/*" multiple hidden></div>

  <div class="row">
    <div><label>水印文字</label><input type="text" id="text" value="仅供内部使用" style="width:200px"></div>
    <div><label>位置</label>
      <select id="pos">
        <option value="br">右下</option><option value="bl">左下</option><option value="tr">右上</option><option value="tl">左上</option>
        <option value="center">正中</option><option value="tile">平铺</option>
      </select>
    </div>
    <div><label>字号（占宽度 %）</label><input type="number" id="size" value="5" min="1" max="20" step="0.5"></div>
    <div><label>透明度</label><input type="number" id="alpha" value="0.45" min="0.05" max="1" step="0.05"></div>
    <div><label>颜色</label><input type="color" id="color" value="#ffffff"></div>
    <div><label>旋转（度）</label><input type="number" id="angle" value="0" min="-90" max="90" step="5"></div>
  </div>

  <div class="row">
    <button class="btn" id="run" disabled>加水印</button>
    <button class="btn ghost" id="dlAll" disabled>打包下载</button>
    <button class="btn ghost" id="clear">清空</button>
  </div>

  <div class="stat" id="stat">还没选图片。</div>
  <div class="grid" id="grid"></div>

  <div class="foot">原理：canvas 上先画原图，再画一层半透明文字。缩放/压缩请在「图片批量处理」里做，两个工具可以连着用。<br>
    缺功能 / 想定制 → <a href="支持.html" style="color:#4ea1ff">反馈与支持</a></div>
</div>

<script>
(function(){
  const $=(s)=>document.querySelector(s);
  const drop=$('#drop'), fileInput=$('#file'), stat=$('#stat'), grid=$('#grid');
  let items=[]; // {file,url,name,blob,previewUrl}

  function human(b){return b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB'}

  function add(list){
    for(const f of [...list]) if(f.type.startsWith('image/')) items.push({file:f,url:URL.createObjectURL(f),blob:null});
    render();
  }
  drop.addEventListener('click',()=>fileInput.click());
  fileInput.addEventListener('change',e=>add(e.target.files));
  ['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('on')}));
  ['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('on')}));
  drop.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) add(e.dataTransfer.files) });

  function render(){
    grid.innerHTML='';
    items.forEach((it,i)=>{
      const c=document.createElement('div'); c.className='cell';
      c.innerHTML=`<img src="${it.previewUrl||it.url}"><div>${it.name||it.file.name}</div>`;
      grid.appendChild(c);
    });
    stat.textContent = items.length? `已选 ${items.length} 张` : '还没选图片。';
    $('#run').disabled = !items.length;
    $('#dlAll').disabled = !items.some(i=>i.blob);
  }

  function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src }) }

  async function draw(it){
    const img=await loadImg(it.url);
    const W=img.naturalWidth, H=img.naturalHeight;
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const ctx=cv.getContext('2d');
    ctx.drawImage(img,0,0);
    const text=$('#text').value||'';
    if(!text) return cv;
    const size=Math.max(8, W*(Number($('#size').value)||5)/100);
    const alpha=Number($('#alpha').value)||0.45;
    const color=$('#color').value||'#ffffff';
    const angle=(Number($('#angle').value)||0)*Math.PI/180;
    const pos=$('#pos').value;
    ctx.font=`600 ${size}px system-ui,"Microsoft YaHei",sans-serif`;
    ctx.fillStyle=color; ctx.globalAlpha=alpha;
    ctx.textBaseline='middle';
    const m=ctx.measureText(text).width;
    const pad=size*0.6;

    if(pos==='tile'){
      const stepX=m+size*3, stepY=size*3.2;
      ctx.save();
      for(let y=stepY; y<H; y+=stepY){
        for(let x=stepX/2; x<W+m; x+=stepX){
          ctx.save(); ctx.translate(x,y); ctx.rotate(-Math.PI/6); ctx.fillText(text,0,0); ctx.restore();
        }
      }
      ctx.restore();
      return cv;
    }
    let x,y;
    if(pos==='br'){ x=W-m-pad; y=H-pad-size/2 }
    else if(pos==='bl'){ x=pad; y=H-pad-size/2 }
    else if(pos==='tr'){ x=W-m-pad; y=pad+size/2 }
    else if(pos==='tl'){ x=pad; y=pad+size/2 }
    else { x=(W-m)/2; y=H/2 }
    ctx.save();
    if(angle){ ctx.translate(x+m/2,y); ctx.rotate(angle); ctx.fillText(text,-m/2,0) }
    else ctx.fillText(text,x,y);
    ctx.restore();
    return cv;
  }

  $('#run').addEventListener('click',async()=>{
    $('#run').disabled=true; stat.textContent='处理中…';
    const fmt = 'image/jpeg', q=0.92;
    for(const it of items){
      try{
        const cv=await draw(it);
        const blob=await new Promise(r=>cv.toBlob(r,fmt,q));
        if(it.previewUrl) URL.revokeObjectURL(it.previewUrl);
        it.blob=blob; it.previewUrl=URL.createObjectURL(blob);
        it.name=it.file.name.replace(/\.[^.]+$/,'')+'_水印.jpg';
      }catch(e){ it.name='失败：'+e.message }
    }
    render();
    const total=items.reduce((s,i)=>s+(i.blob?i.blob.size:0),0);
    stat.innerHTML=`处理完 <b>${items.filter(i=>i.blob).length}</b> 张，合计 ${human(total)}`;
  });

  // 极简 zip（store）
  function crc32(u8){let c,crc=0xffffffff;for(let i=0;i<u8.length;i++){c=(crc^u8[i])&0xff;for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:c>>>1;crc=(crc>>>8)^c}return (crc^0xffffffff)>>>0}
  function makeZip(entries){
    const enc=new TextEncoder(),parts=[],central=[];let off=0;
    const dt=new Date(),t=((dt.getHours()<<11)|(dt.getMinutes()<<5)|(dt.getSeconds()/2))&0xffff;
    const d=(((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate())&0xffff;
    for(const f of entries){
      const name=enc.encode(f.name),crc=crc32(f.u8),sz=f.u8.length;
      const lh=new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);
      lh.setUint16(8,0,true);lh.setUint16(10,t,true);lh.setUint16(12,d,true);
      lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);
      lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
      parts.push(new Uint8Array(lh.buffer),name,f.u8);
      const ch=new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);
      ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,t,true);ch.setUint16(14,d,true);
      ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);
      ch.setUint16(28,name.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);
      ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,off,true);
      central.push(new Uint8Array(ch.buffer),name);
      off+=30+name.length+sz;
    }
    const cSize=central.reduce((s,a)=>s+a.length,0);
    const end=new DataView(new ArrayBuffer(22));
    end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);
    end.setUint32(12,cSize,true);end.setUint32(16,off,true);end.setUint16(20,0,true);
    return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:'application/zip'});
  }

  $('#dlAll').addEventListener('click',async()=>{
    const entries=[];
    for(const it of items){ if(!it.blob) continue; entries.push({name:it.name||'watermarked.jpg', u8:new Uint8Array(await it.blob.arrayBuffer())}) }
    if(!entries.length) return;
    const blob=makeZip(entries);
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='水印结果.zip'; a.click();
    stat.innerHTML=`已打包 <b>${entries.length}</b> 张 → 水印结果.zip（在浏览器下载文件夹）`;
  });

  $('#clear').addEventListener('click',()=>{ items.forEach(i=>{URL.revokeObjectURL(i.url); if(i.previewUrl) URL.revokeObjectURL(i.previewUrl)}); items=[]; render(); });
})();
</script>
</body>
</html>
